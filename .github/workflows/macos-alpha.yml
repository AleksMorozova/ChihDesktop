name: macOS alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Alpha (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-15
          - rid: osx-x64
            runner: macos-15-intel
    defaults:
      run:
        shell: bash
        working-directory: tools/ChihDesktop.Mac
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.401'
      - name: Build, ad-hoc sign, package and validate alpha
        env:
          TARGET_RID: ${{ matrix.rid }}
          ALPHA_BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash packaging/build-alpha.sh "$TARGET_RID" "$ALPHA_BUILD"
      - name: Upload validated ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChihDesktop-macos-alpha-${{ matrix.rid }}
          path: artifacts/mac-alpha/${{ matrix.rid }}/dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload native and signature diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChihDesktop-macos-native-diagnostics-${{ matrix.rid }}
          path: |
            artifacts/mac-alpha/${{ matrix.rid }}/check-*/*.otool-*.txt
            artifacts/mac-alpha/${{ matrix.rid }}/check-*/*.records.txt
            artifacts/mac-alpha/${{ matrix.rid }}/check-*/codesign-*.txt
            artifacts/mac-alpha/${{ matrix.rid }}/check-*/spctl.txt
            artifacts/mac-alpha/${{ matrix.rid }}/signing/*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize scope
        run: |
          {
            echo '### macOS alpha'
            echo 'Validated a self-contained bundle and its extracted ZIP on the matching CPU runner.'
            echo 'Ad-hoc signed; deep/strict signature verification passed before and after ZIP extraction.'
            echo 'NOT Developer ID signed or notarized; spctl is diagnostic only. No desktop GUI acceptance was performed.'
            echo 'No Windows projects, user profiles or GitHub Releases were touched.'
          } >> "$GITHUB_STEP_SUMMARY"
